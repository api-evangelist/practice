description: Practice (practice.do) was a Montreal-based all-in-one coaching and consulting
  business platform that bundled scheduling, client portals, forms, contracts, invoicing,
  and payments into a single tool for independent coaches. It raised a $10M seed round
  in 2021 led by a16z (Andrew Chen participating). The company shut down permanently
  on November 3, 2025 after a failed acquisition process; its domain no longer serves
  a product and it exposes no public developer portal, documentation, or API surface.
